plugins {
    // Ensure single quotes for modern Gradle syntax
    id 'com.android.application'
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id 'kotlin-android'
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace = "com.example.homecare0x1"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        // ESSENTIAL: Must be set to 1.8 for desugaring to work
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        
        // FIX: Add this line to explicitly enable desugaring 
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.homecare0x1"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// FIX: This block is necessary to resolve the checkDebugAarMetadata error
dependencies {
    // Add the desugaring library dependency
    // Using version 2.1.4 as it is a common stable recent choice
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' 
    
    // Add any other dependencies your app uses below this line
}